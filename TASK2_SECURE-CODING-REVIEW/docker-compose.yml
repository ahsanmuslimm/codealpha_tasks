version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codesentry
      POSTGRES_PASSWORD: codesentry
      POSTGRES_DB: codesentry
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://codesentry:codesentry@db:5432/codesentry
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-codesentry-dev-secret-change-in-production}
      UPLOADS_DIR: /app/uploads
      ARTIFACTS_DIR: /app/artifacts
    volumes:
      - uploads:/app/uploads
      - artifacts:/app/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://codesentry:codesentry@db:5432/codesentry
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-codesentry-dev-secret-change-in-production}
      UPLOADS_DIR: /app/uploads
      ARTIFACTS_DIR: /app/artifacts
    volumes:
      - uploads:/app/uploads
      - artifacts:/app/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
      - redis
    command: >
      sh -c "celery -A app.tasks worker --loglevel=info"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
  uploads:
  artifacts:
